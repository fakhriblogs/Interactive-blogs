    * { box-sizing: border-box; font-family: 'Cairo', system-ui, -apple-system, sans-serif; }

    .pixel-bevel { box-shadow: inset 2px 2px 0 0 rgba(255,255,255,0.4), inset -2px -2px 0 0 rgba(0,0,0,0.3), 4px 4px 0 0 #1e293b; }

    /* Clean Upright Classic Heart Splitting Smoothly Down the Center */
    @keyframes heartSplitLeft {
      0% { transform: translate(0, 0) rotate(0deg); }
      35% { transform: translate(-8px, 0) rotate(-4deg); }
      70% { transform: translate(-6px, 0) rotate(-2deg); }
      100% { transform: translate(-8px, 0) rotate(-4deg); }
    }
    @keyframes heartSplitRight {
      0% { transform: translate(0, 0) rotate(0deg); }
      35% { transform: translate(8px, 0) rotate(4deg); }
      70% { transform: translate(6px, 0) rotate(2deg); }
      100% { transform: translate(8px, 0) rotate(4deg); }
    }
    @keyframes goldCupRadiance {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.15) rotate(-4deg) translateY(-6px); }
      75% { transform: scale(1.12) rotate(4deg) translateY(-4px); }
    }
    @keyframes cardShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .heart-half-left {
      transform-origin: 32px 54px;
      animation: heartSplitLeft 1.1s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }
    .heart-half-right {
      transform-origin: 32px 54px;
      animation: heartSplitRight 1.1s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }
    .gold-cup-animation { animation: goldCupRadiance 1.4s ease-in-out infinite; }
    .card-shaking { animation: cardShake 0.55s ease-in-out; }

  <script>
    // Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playCorrectSound() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const notes = [523.25, 659.25, 783.99, 1046.5];
      const now = audioCtx.currentTime;
      notes.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(f, now + i * 0.08);
        gain.gain.setValueAtTime(0.2, now + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.08);
        osc.stop(now + i * 0.08 + 0.32);
      });
    }

    function playWrongSound() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.exponentialRampToValueAtTime(90, now + 0.45);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.46);
    }

    // Default Philosophy Topics & Interactive Blogs

            options: [

    function getStorageQuizzes() {
      try {
        const stored = localStorage.getItem('fakhri_blogs_v5');
        return stored ? JSON.parse(stored) : initialQuizzes;
      } catch(e) {
        return initialQuizzes;
      }
    }

    function saveStorageQuizzes(q) {
      localStorage.setItem('fakhri_blogs_v5', JSON.stringify(q));
    }

    let currentQuizzes = getStorageQuizzes();
    let selectedTopic = 'الكل';

    // View Routing
    function showHome() {
      const app = document.getElementById('app');
      currentQuizzes = getStorageQuizzes();

      const topics = ['الكل', ...new Set(currentQuizzes.map(q => q.category).filter(Boolean))];

      let filterPills = '';
      topics.forEach(t => {
        const active = selectedTopic === t;
        filterPills += `
          <button onclick="setFilterTopic('${t}')" class="px-3 py-1 text-xs font-bold whitespace-nowrap border pixel-press transition-colors ${
            active ? 'bg-bac-brown pixel-bevel font-extrabold pixel-shadow' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'
          }">
            ${t}
          </button>
        `;
      });

      let html = `
        <div class="bg-white border-2 border-slate-900 p-5 pixel-shadow mb-4 text-center">

            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none">

              <path d="M17.472 14.382c-.301-.15-1.78-.878-2.056-.979-.276-.1-.476-.15-.677.15-.2.301-.777.979-.953 1.179-.175.2-.351.226-.652.075-.301-.15-1.27-.468-2.42-1.493-.894-.798-1.498-1.783-1.674-2.084-.175-.3-.019-.463.132-.613.135-.135.301-.351.451-.527.15-.175.2-.301.301-.501.1-.2.05-.376-.025-.527-.075-.15-.677-1.631-.928-2.233-.244-.586-.492-.507-.677-.516-.175-.009-.376-.009-.577-.009-.2 0-.526.075-.802.376-.276.301-1.053 1.029-1.053 2.509 0 1.48 1.078 2.91 1.228 3.111.15.2 2.122 3.24 5.141 4.545.718.311 1.28.497 1.717.636.722.229 1.378.197 1.897.12.578-.086 1.78-.727 2.031-1.43.251-.702.251-1.304.175-1.43-.075-.125-.276-.201-.577-.351z" fill="#ffffff" />

          </div>
          <p class="text-xs md:text-sm text-slate-700 font-semibold max-w-md mx-auto">
            مدونات فلسفية تفاعلية وألعاب بطاقات ممتعة لتلاميذ البكالوريا، تمنحك فهماً عميقاً وتقييماً فورياً مشوقاً داخل واتساب.
          </p>

        <div class="space-y-3 mb-4">
          <input type="text" id="searchInput" oninput="filterQuizzes()" placeholder="ابحث حسب العناوين والمحاور" class="w-full px-3 py-2.5 bg-white border-2 border-slate-900 text-xs md:text-sm font-bold pixel-shadow focus:outline-none">

    function setFilterTopic(t) {
      selectedTopic = t;
      showHome();
    }

    function renderQuizCards() {
      const qText = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
      const filtered = currentQuizzes.filter(item => {
        const matchSearch = item.title.toLowerCase().includes(qText) || (item.category && item.category.toLowerCase().includes(qText));
        const matchTopic = selectedTopic === 'الكل' || item.category === selectedTopic;
        return matchSearch && matchTopic;
      });

      if (filtered.length === 0) {
        return '<div class="text-center p-6 text-slate-500 font-bold">لا توجد مدونة تفاعلية تطابق البحث!</div>';
      }

      let html = '';
      filtered.forEach(q => {
        const isMatching = q.blogType === 'matching_cards';
        const countText = isMatching ? `${q.matchingPairs?.length || 0} أزواج` : `${q.questions?.length || 0} أسئلة`;

        html += `
          <div onclick="startActivity('${q.id}')" class="bg-white border-2 border-slate-900 p-4 pixel-shadow hover:translate-x-[-2px] hover:translate-y-[-2px] transition-transform cursor-pointer">
            <div class="flex items-center justify-between mb-1.5">
              <div class="flex items-center gap-1.5">
                <span class="px-2 py-0.5 text-[11px] font-black border" style="background-color: rgba(141, 91, 53, 0.12); color: #6e3c1b; border-color: rgba(141, 91, 53, 0.3);">${q.category || 'فلسفة'}</span>
                ${isMatching ? '<span class="px-2 py-0.5 bg-yellow-100 text-yellow-900 text-[10px] font-black border border-yellow-400">البطاقات</span>' : '<span class="px-2 py-0.5 bg-orange-100 text-orange-900 text-[10px] font-black border border-orange-400">كويزات</span>'}
              </div>
              <span class="text-xs text-slate-500 font-bold">${countText}</span>
            </div>
            <h3 class="text-base font-black text-slate-900 mb-1">${q.title}</h3>
            <p class="text-xs text-slate-600 line-clamp-2 mb-3">${q.description || ''}</p>
            <div class="flex items-center justify-between pt-2 border-t border-slate-200">
              <span class="text-[11px] font-bold text-slate-500">تحدي خاص بالبكالوريا</span>
              <!-- CTA Button in Vibrant Emerald Green -->
              <span class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs pixel-bevel pixel-press flex items-center gap-1">
                <span>ابدأ المدونة التفاعلية</span>
                <span>▶</span>
              </span>
            </div>
          </div>
        `;
      });
      return html;
    }

    function filterQuizzes() {
      const container = document.getElementById('quizListContainer');
      if (container) container.innerHTML = renderQuizCards();
    }

    function startActivity(id) {
      const item = currentQuizzes.find(x => x.id === id) || currentQuizzes[0];
      if (item.blogType === 'matching_cards') {
        startMatchingGame(item);
      } else {
        startQuiz(item);
      }
    }

    // ==========================================
    // 🃏 Matching Cards Game Implementation
    // ==========================================
    let activeMatchingGame = null;
    let matchingCards = [];
    let selectedFirstCard = null;
    let matchedPairs = [];
    let matchingMistakes = 0;
    let isMatchingProcessing = false;

    function startMatchingGame(game) {
      activeMatchingGame = game;
      matchedPairs = [];
      matchingMistakes = 0;
      selectedFirstCard = null;
      isMatchingProcessing = false;

      // Build and shuffle cards
      const suits = ['♥', '♦', '♣', '♠'];
      const raw = [];
      (game.matchingPairs || []).forEach((p, i) => {
        const suit = p.suit || suits[i % suits.length];
        raw.push({ id: `card-${p.id}-A`, pairId: p.id, text: p.itemA, side: 'A', suit });
        raw.push({ id: `card-${p.id}-B`, pairId: p.id, text: p.itemB, side: 'B', suit });
      });

      // Shuffle
      for (let i = raw.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [raw[i], raw[j]] = [raw[j], raw[i]];
      }
      matchingCards = raw;

      renderMatchingView();
    }

    function renderMatchingView() {
      const app = document.getElementById('app');
      const totalPairs = activeMatchingGame.matchingPairs.length;
      const progress = Math.round((matchedPairs.length / totalPairs) * 100);

      let gridHtml = '';
      matchingCards.forEach(c => {
        const isMatched = matchedPairs.includes(c.pairId);
        const isSelected = selectedFirstCard && selectedFirstCard.id === c.id;
        const isRed = c.suit === '♥' || c.suit === '♦';

        let cardClass = 'bg-white border-2 border-slate-900 text-slate-900 pixel-press';
        if (isMatched) {
          cardClass = 'bg-emerald-50 border-2 border-emerald-600 text-emerald-950 opacity-90 cursor-default';
        } else if (isSelected) {
          cardClass = 'bg-amber-50 border-2 border-amber-500 ring-2 ring-amber-400 scale-[1.03] -translate-y-1';
        }

        gridHtml += `
          <div id="${c.id}" onclick="handleMatchingCardClick('${c.id}')" class="aspect-[2.3/3.6] p-2 text-center flex flex-col justify-between border-2 transition-all pixel-shadow select-none relative ${cardClass}">

    function handleMatchingCardClick(cardId) {
      if (isMatchingProcessing) return;
      const card = matchingCards.find(c => c.id === cardId);
      if (!card || matchedPairs.includes(card.pairId)) return;
      if (selectedFirstCard && selectedFirstCard.id === card.id) return;

      if (!selectedFirstCard) {
        selectedFirstCard = card;
        renderMatchingView();
        return;
      }

      // Second card clicked -> Compare
      isMatchingProcessing = true;
      const el1 = document.getElementById(selectedFirstCard.id);
      const el2 = document.getElementById(card.id);

      if (selectedFirstCard.pairId === card.pairId) {
        // MATCH!
        playCorrectSound();
        matchedPairs.push(card.pairId);
        selectedFirstCard = null;
        isMatchingProcessing = false;
        renderMatchingView();

        if (matchedPairs.length === activeMatchingGame.matchingPairs.length) {
          setTimeout(renderMatchingWin, 500);
        }
      } else {
        // MISMATCH! Shake & sound
        playWrongSound();
        matchingMistakes++;
        if (el1) el1.classList.add('card-shaking', 'bg-rose-50', 'border-rose-600');
        if (el2) el2.classList.add('card-shaking', 'bg-rose-50', 'border-rose-600');

        setTimeout(() => {
          selectedFirstCard = null;
          isMatchingProcessing = false;
          renderMatchingView();
        }, 650);
      }
    }

          <div class="text-center">
            <h3 class="text-lg font-black text-slate-900">اختر نوع المدونة التفاعلية الجديدة</h3>
            <p class="text-xs text-slate-500 mt-1">اختر النمط المناسب لمحتوى قناتك على واتساب</p>
          </div>

          <div class="space-y-3">
            <!-- Mode 1: Standard Q&A -->
            <button onclick="showCreateQuizForm()" class="w-full text-right p-4 border-2 border-slate-900 bg-white hover:bg-slate-50 pixel-shadow pixel-press flex items-start gap-3">
              <span class="text-2xl">📝</span>
              <div>
                <h4 class="text-sm font-black text-slate-900">1. مدونة تفاعلية عادية (أسئلة واختيارات)</h4>
                <p class="text-xs text-slate-600 mt-0.5">أسئلة باختيارات متعددة (أ، ب، ج، د) مع كأس النجاح وانشطار القلب عند الخطأ وإضاءات فلسفية.</p>
              </div>
            </button>

            <!-- Mode 2: Matching Cards Game -->
            <button onclick="showCreateMatchingGameForm()" class="w-full text-right p-4 border-2 border-emerald-600 bg-emerald-50 hover:bg-emerald-100 pixel-shadow pixel-press flex items-start gap-3">
              <span class="text-2xl">🃏</span>
              <div>
                <div class="flex items-center gap-1.5">
                  <h4 class="text-sm font-black text-emerald-900">2. لعبة مطابقة بطاقات اللعب (جديد)</h4>
                  <span class="text-[9px] bg-emerald-600 text-white px-1 font-bold">ممتعة جداً</span>
                </div>
                <p class="text-xs text-emerald-800 mt-0.5">بطاقات لعب برموز القلب والمعين، يقوم التلميذ بربط كل فيلسوف بأطروحته؛ تتلون بالأخضر عند النجاح أو ترتعش عند الخطأ!</p>
              </div>
            </button>
          </div>

          <button onclick="showAdmin()" class="w-full py-2 text-xs font-bold text-slate-500 hover:text-slate-800">إلغاء والعودة</button>
        </div>
      `;
    }

    // Form for Mode 1: Standard Quiz
    function showCreateQuizForm() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="bg-white border-2 border-slate-900 p-5 pixel-shadow max-w-lg w-full mx-auto my-2 space-y-3">
          <h3 class="text-base font-black text-slate-900">إنشاء مدونة أسئلة تفاعلية عادية</h3>
          <div>
            <label class="block text-xs font-bold mb-1">عنوان المدونة التفاعلية:</label>
            <input type="text" id="newQuizTitle" placeholder="مثال: الإنية والغيرية: الوعي والجسد" class="w-full px-3 py-2 border-2 border-slate-900 text-xs font-bold">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">المحور / الدرس:</label>
            <input type="text" id="newQuizCat" placeholder="مثال: الإنية والغيرية" class="w-full px-3 py-2 border-2 border-slate-900 text-xs font-bold">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">نص السؤال الأول:</label>
            <textarea id="newQuizQ1" rows="2" placeholder="اكتب نص السؤال..." class="w-full px-3 py-2 border-2 border-slate-900 text-xs font-bold"></textarea>
          </div>
          <div class="space-y-1.5">
            <label class="block text-xs font-bold">الخيارات الأربعة (حدد الإجابة الصحيحة):</label>
            <div class="flex items-center gap-2">
              <input type="radio" name="correctOpt" value="0" checked>
              <input type="text" id="opt0" placeholder="الخيار (أ) - الصحيح" class="flex-1 px-2.5 py-1.5 border border-slate-900 text-xs font-bold">
            </div>
            <div class="flex items-center gap-2">
              <input type="radio" name="correctOpt" value="1">
              <input type="text" id="opt1" placeholder="الخيار (ب)" class="flex-1 px-2.5 py-1.5 border border-slate-900 text-xs">
            </div>
            <div class="flex items-center gap-2">
              <input type="radio" name="correctOpt" value="2">
              <input type="text" id="opt2" placeholder="الخيار (ج)" class="flex-1 px-2.5 py-1.5 border border-slate-900 text-xs">
            </div>
            <div class="flex items-center gap-2">
              <input type="radio" name="correctOpt" value="3">
              <input type="text" id="opt3" placeholder="الخيار (د)" class="flex-1 px-2.5 py-1.5 border border-slate-900 text-xs">
            </div>
          </div>
          <div class="flex gap-2 pt-2">
            <button onclick="saveNewStandardQuiz()" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs pixel-bevel pixel-press">حفظ وتوليد الرابط</button>
            <button onclick="showAdmin()" class="px-4 py-2 border border-slate-900 text-xs font-bold">إلغاء</button>
          </div>
        </div>
      `;
    }

    function saveNewStandardQuiz() {
      const title = document.getElementById('newQuizTitle').value.trim();
      const cat = document.getElementById('newQuizCat').value.trim() || 'فلسفة';
      const qText = document.getElementById('newQuizQ1').value.trim();
      const o0 = document.getElementById('opt0').value.trim();
      const o1 = document.getElementById('opt1').value.trim();
      const o2 = document.getElementById('opt2').value.trim();
      const o3 = document.getElementById('opt3').value.trim();
      const radios = document.getElementsByName('correctOpt');
      let corr = 0;
      radios.forEach((r, idx) => { if (r.checked) corr = idx; });

      if (!title || !qText || !o0 || !o1) {
        alert("يرجى ملء العنوان ونص السؤال وخيارين على الأقل!");
        return;
      }

      const newQ = {
        id: `quiz_${Date.now()}`,
        title,
        category: cat,
        description: 'مدونة تفاعلية للبكالوريا تم إنشاؤها عبر لوحة التحكم.',
        blogType: 'standard',
        questions: [
          {
            q: qText,
            options: [o0, o1, o2 || 'لا شيء مما سبق', o3 || 'كل ما سبق'],
            correct: corr,
            exp: 'تمت إضافة هذا السؤال من قبل الأستاذ.'
          }
        ]
      };

      currentQuizzes.unshift(newQ);
      saveStorageQuizzes(currentQuizzes);
      alert("تم إنشاء المدونة التفاعلية بنجاح!");
      showAdmin();
    }

    // Form for Mode 2: Matching Game
    function showCreateMatchingGameForm() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="bg-white border-2 border-slate-900 p-5 pixel-shadow max-w-lg w-full mx-auto my-2 space-y-3">
          <div class="flex items-center gap-2">
            <span class="text-2xl">🃏</span>
            <h3 class="text-base font-black text-slate-900">إنشاء لعبة مطابقة بطاقات الفلسفة</h3>
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">عنوان اللعبة / التحدي:</label>
            <input type="text" id="matchGameTitle" placeholder="مثال: مطابقة فلاسفة الإنية والحرية" class="w-full px-3 py-2 border-2 border-slate-900 text-xs font-bold">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">المحور / الدرس:</label>
            <input type="text" id="matchGameCat" placeholder="مثال: الإنية والغيرية" class="w-full px-3 py-2 border-2 border-slate-900 text-xs font-bold">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">السؤال / التوجيه أعلى البطاقات:</label>
            <input type="text" id="matchGameDesc" placeholder="مثال: اربط كل فيلسوف بأطروحته أو مقولته الشهيرة" class="w-full px-3 py-2 border-2 border-slate-900 text-xs font-bold">
          </div>

          <div class="pt-2 border-t border-slate-200">
            <label class="block text-xs font-black mb-2">أزواج البطاقات المتطابقة (3 أزواج أساسية):</label>
            <div class="space-y-2">
              <div class="p-2 border border-slate-300 bg-slate-50 flex gap-2">
                <input type="text" id="pairA1" placeholder="بطاقة 1: الفيلسوف (ديكارت)" class="w-1/2 p-1.5 border border-slate-900 text-xs font-bold">
                <input type="text" id="pairB1" placeholder="بطاقة 2: مقولته (أنا أفكر إذن أنا موجود)" class="w-1/2 p-1.5 border border-slate-900 text-xs font-bold">
              </div>
              <div class="p-2 border border-slate-300 bg-slate-50 flex gap-2">
                <input type="text" id="pairA2" placeholder="بطاقة 1: (سارتر)" class="w-1/2 p-1.5 border border-slate-900 text-xs font-bold">
                <input type="text" id="pairB2" placeholder="بطاقة 2: (الوجود يسبق الماهية)" class="w-1/2 p-1.5 border border-slate-900 text-xs font-bold">
              </div>
              <div class="p-2 border border-slate-300 bg-slate-50 flex gap-2">
                <input type="text" id="pairA3" placeholder="بطاقة 1: (سبينوزا)" class="w-1/2 p-1.5 border border-slate-900 text-xs font-bold">
                <input type="text" id="pairB3" placeholder="بطاقة 2: (الحرية وهم ناشئ عن الجهل بالعلل)" class="w-1/2 p-1.5 border border-slate-900 text-xs font-bold">
              </div>
            </div>
          </div>

          <div class="flex gap-2 pt-2">
            <button onclick="saveNewMatchingGame()" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs pixel-bevel pixel-press">حفظ لعبة البطاقات وتوليد الرابط</button>
            <button onclick="showAdmin()" class="px-4 py-2 border border-slate-900 text-xs font-bold">إلغاء</button>
          </div>
        </div>
      `;
    }

    function saveNewMatchingGame() {
      const title = document.getElementById('matchGameTitle').value.trim();
      const cat = document.getElementById('matchGameCat').value.trim() || 'فلسفة';
      const desc = document.getElementById('matchGameDesc').value.trim() || 'اربط كل فيلسوف بأطروحته الفلسفية!';
      const a1 = document.getElementById('pairA1').value.trim();
      const b1 = document.getElementById('pairB1').value.trim();
      const a2 = document.getElementById('pairA2').value.trim();
      const b2 = document.getElementById('pairB2').value.trim();
      const a3 = document.getElementById('pairA3').value.trim();
      const b3 = document.getElementById('pairB3').value.trim();

      if (!title || !a1 || !b1 || !a2 || !b2) {
        alert("يرجى كتابة عنوان اللعبة وملء زوجين من البطاقات على الأقل!");
        return;
      }

      const pairs = [
        { id: 'p1', itemA: a1, itemB: b1, suit: '♥' },
        { id: 'p2', itemA: a2, itemB: b2, suit: '♦' }
      ];
      if (a3 && b3) pairs.push({ id: 'p3', itemA: a3, itemB: b3, suit: '♠' });

      const newGame = {
        id: `match_${Date.now()}`,
        title,
        category: cat,
        description: desc,
        blogType: 'matching_cards',
        matchingPairs: pairs,
        questions: []
      };

      currentQuizzes.unshift(newGame);
      saveStorageQuizzes(currentQuizzes);
      alert("تم إنشاء لعبة مطابقة البطاقات بنجاح!");
      showAdmin();
    }

    // Initialize View based on URL params or show Home
    const urlParams = new URLSearchParams(window.location.search);
    const quizParam = urlParams.get('quiz');
    if (quizParam) {
      startActivity(quizParam);
    } else {
      showHome();
    }
  </script>
</body>
</html>
