    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playCorrectSound() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const notes = [523.25, 659.25, 783.99, 1046.5];
      const now = audioCtx.currentTime;
      notes.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(f, now + i * 0.08);
        gain.gain.setValueAtTime(0.2, now + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.08);
        osc.stop(now + i * 0.08 + 0.32);
      });
    }

    function playWrongSound() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.exponentialRampToValueAtTime(90, now + 0.45);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.46);
    }

    function startActivity(id) {
      const item = currentQuizzes.find(x => x.id === id) || currentQuizzes[0];
      if (item.blogType === 'matching_cards') {
        startMatchingGame(item);
      } else {
        startQuiz(item);

    // ==========================================
    // 🃏 Matching Cards Game Implementation
    // ==========================================
    let activeMatchingGame = null;
    let matchingCards = [];
    let selectedFirstCard = null;
    let matchedPairs = [];
    let matchingMistakes = 0;
    let isMatchingProcessing = false;

    function startMatchingGame(game) {
      activeMatchingGame = game;
      matchedPairs = [];
      matchingMistakes = 0;
      selectedFirstCard = null;
      isMatchingProcessing = false;

      // Build and shuffle cards
      const suits = ['♥', '♦', '♣', '♠'];
      const raw = [];
      (game.matchingPairs || []).forEach((p, i) => {
        const suit = p.suit || suits[i % suits.length];
        raw.push({ id: `card-${p.id}-A`, pairId: p.id, text: p.itemA, side: 'A', suit });
        raw.push({ id: `card-${p.id}-B`, pairId: p.id, text: p.itemB, side: 'B', suit });
      });

      // Shuffle
      for (let i = raw.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [raw[i], raw[j]] = [raw[j], raw[i]];
      }
      matchingCards = raw;

      renderMatchingView();
    }

    function handleMatchingCardClick(cardId) {
      if (isMatchingProcessing) return;
      const card = matchingCards.find(c => c.id === cardId);
      if (!card || matchedPairs.includes(card.pairId)) return;
      if (selectedFirstCard && selectedFirstCard.id === card.id) return;

      if (!selectedFirstCard) {
        selectedFirstCard = card;
        renderMatchingView();
        return;
      }

      // Second card clicked -> Compare
      isMatchingProcessing = true;
      const el1 = document.getElementById(selectedFirstCard.id);
      const el2 = document.getElementById(card.id);

      if (selectedFirstCard.pairId === card.pairId) {
        // MATCH!
        playCorrectSound();
        matchedPairs.push(card.pairId);
        selectedFirstCard = null;
        isMatchingProcessing = false;
        renderMatchingView();

        if (matchedPairs.length === activeMatchingGame.matchingPairs.length) {
          setTimeout(renderMatchingWin, 500);
        }
      } else {
        // MISMATCH! Shake & sound
        playWrongSound();
        matchingMistakes++;
        if (el1) el1.classList.add('card-shaking', 'bg-rose-50', 'border-rose-600');
        if (el2) el2.classList.add('card-shaking', 'bg-rose-50', 'border-rose-600');

        setTimeout(() => {
          selectedFirstCard = null;
          isMatchingProcessing = false;
          renderMatchingView();
        }, 650);
      }
    }

        showAdmin();

    function copyQuizLink(id, title) {

      navigator.clipboard.writeText(msg).then(() => {
        alert("تم نسخ الرابط مع رسالة جاهزة لقناة واتساب!");
      }).catch(() => {
        prompt("انسخ الرابط التالي:", msg);

    function showCreateQuizForm(existing) {
      if (existing) {
        quizFormState = {
          editingId: existing.id,
          title: existing.title || '',
          category: existing.category || 'فلسفة',
          questions: existing.questions && existing.questions.length > 0
            ? existing.questions.map(item => ({
                q: item.q || item.question || '',
                options: item.options && item.options.length >= 2 ? [...item.options] : ['', ''],
                correct: typeof item.correct === 'number' ? item.correct : (item.correctIndex || 0),
                exp: item.exp || item.explanation || ''
              }))
            : [
                {
                  q: '',
                  options: ['', '', '', ''],
                  correct: 0,
                  exp: ''
                }
              ]
        };
      } else {
        quizFormState = {
          editingId: null,
          title: '',
          category: 'فلسفة',
          questions: [
            {
              q: '',
              options: ['', '', '', ''],
              correct: 0,
              exp: ''
            }
          ]
        };
      }
      renderQuizForm();
    }

              <input type="text" value="${(opt || '').replace(/"/g, '&quot;')}" oninput="quizFormState.questions[${qIdx}].options[${optIdx}] = this.value" placeholder="الخيار ${optIdx + 1}..." class="flex-1 p-1 text-xs border border-slate-200 bg-slate-50 font-bold">

              ${question.options.length > 2 ? `<button type="button" onclick="removeQuizOption(${qIdx}, ${optIdx})" class="text-rose-600 hover:text-rose-800 font-black px-1.5 py-0.5 text-xs" title="حذف هذا الخيار">✕</button>` : ''}

        questionsHtml += `

              <span class="text-xs font-black text-slate-900">السؤال رقم #${qIdx + 1}</span>

                  <span>+ إضافة خيار إضافي</span>

              </div>
              <div class="space-y-1.5">
                ${optionsHtml}

            </div>

            <div>
              <label class="block text-[11px] font-bold text-slate-600 mb-1">إضاءة / تعليل فلسفي يظهر بعد الإجابة (اختياري):</label>
              <input type="text" value="${(question.exp || '').replace(/"/g, '&quot;')}" oninput="quizFormState.questions[${qIdx}].exp = this.value" placeholder="توضيح أو معلومة إضافية للبكالوريا..." class="w-full px-2.5 py-1.5 border border-slate-300 text-xs bg-white">
            </div>
          </div>
        `;
      });

      app.innerHTML = `
        <div class="bg-white border-2 border-slate-900 p-4 sm:p-5 pixel-shadow max-w-lg w-full mx-auto my-2 space-y-3">
          <div class="flex items-center justify-between border-b pb-2">
            <h3 class="text-base font-black text-slate-900">${quizFormState.editingId ? 'تعديل المدونة التفاعلية' : 'إنشاء مدونة تفاعلية جديدة (كويز)'}</h3>
            <span class="text-xs font-bold text-slate-500">${quizFormState.editingId ? 'وضع التعديل' : 'جديد'}</span>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold mb-1">عنوان المدونة التفاعلية:</label>
              <input type="text" id="newQuizTitle" value="${quizFormState.title.replace(/"/g, '&quot;')}" oninput="quizFormState.title = this.value" placeholder="مثال: الإنية والغيرية: الوعي والجسد" class="w-full px-2.5 py-2 border-2 border-slate-900 text-xs font-bold">
            </div>
            <div>
              <label class="block text-xs font-bold mb-1">المحور / الدرس:</label>
              <input type="text" id="newQuizCat" value="${quizFormState.category.replace(/"/g, '&quot;')}" oninput="quizFormState.category = this.value" placeholder="مثال: الإنية والغيرية" class="w-full px-2.5 py-2 border-2 border-slate-900 text-xs font-bold">
            </div>
          </div>

          <div class="pt-2">
            <div class="flex items-center justify-between mb-2">

    function addQuizQuestion() {
      quizFormState.questions.push({
        q: '',
        options: ['', '', '', ''],
        correct: 0,
        exp: ''
      });
      renderQuizForm();
    }

    function removeQuizQuestion(qIdx) {
      if (quizFormState.questions.length <= 1) {
        alert("يجب توفر سؤال واحد على الأقل في المدونة!");
        return;
      }
      quizFormState.questions.splice(qIdx, 1);
      renderQuizForm();
    }

    function addQuizOption(qIdx) {
      if (quizFormState.questions[qIdx].options.length >= 6) {
        alert("الحد الأقصى للخيارات هو 6 خيارات لكل سؤال.");
        return;
      }
      quizFormState.questions[qIdx].options.push('');
      renderQuizForm();
    }

    function removeQuizOption(qIdx, optIdx) {
      const q = quizFormState.questions[qIdx];
      if (q.options.length <= 2) {
        alert("يجب توفر خيارين على الأقل في السؤال!");
        return;
      }
      q.options.splice(optIdx, 1);
      if (q.correct >= q.options.length) {
        q.correct = q.options.length - 1;
      }
      renderQuizForm();
    }

    function saveStandardQuiz() {
      const title = (quizFormState.title || '').trim();
      const cat = (quizFormState.category || 'فلسفة').trim();

      if (!title) {
        alert("يرجى ملء عنوان المدونة التفاعلية!");
        return;
      }

      const validQuestions = [];
      for (let i = 0; i < quizFormState.questions.length; i++) {
        const item = quizFormState.questions[i];
        const qText = (item.q || '').trim();
        const validOptions = (item.options || []).map(o => o.trim()).filter(Boolean);

        if (!qText || validOptions.length < 2) {
          alert(`السؤال رقم #${i + 1} غير مكتمل! يرجى ملء نص السؤال وخيارين على الأقل.`);
          return;
        }

        validQuestions.push({
          id: `q_${i + 1}_${Date.now()}`,
          q: qText,
          options: validOptions,
          correct: Math.min(item.correct || 0, validOptions.length - 1),
          exp: (item.exp || '').trim() || 'إضاءة فلسفية من الأستاذ للبكالوريا.'
        });
      }

      if (validQuestions.length === 0) {
        alert("يرجى إضافة سؤال واحد على الأقل!");
        return;
      }

      if (quizFormState.editingId) {
        const item = currentQuizzes.find(x => x.id === quizFormState.editingId);
        if (item) {
          item.title = title;
          item.category = cat;
          item.questions = validQuestions;
          saveStorageQuizzes(currentQuizzes);
          alert("تم حفظ تعديلات الكويز بنجاح!");
          showAdmin();
          return;
        }
      }

      const newQ = {
        id: `quiz_${Date.now()}`,
        title,
        category: cat,
        description: 'مدونة تفاعلية للبكالوريا تم إنشاؤها عبر لوحة التحكم.',
        blogType: 'standard',
        questions: validQuestions
      };

      currentQuizzes.unshift(newQ);
      saveStorageQuizzes(currentQuizzes);
      alert("تم إنشاء المدونة التفاعلية بنجاح!");
      showAdmin();
    }

      category: '',

        { itemA: '', itemB: '' },
        { itemA: '', itemB: '' },
        { itemA: '', itemB: '' }
      ]

            { itemA: 'سارتر', itemB: 'الوجود يسبق الماهية' }
          ]
        };
      }
      renderMatchingForm();

          <div>
            <label class="block text-xs font-bold mb-1">السؤال / التوجيه أعلى البطاقات:</label>
            <input type="text" id="matchGameDesc" value="${matchFormState.description.replace(/"/g, '&quot;')}" oninput="matchFormState.description = this.value" placeholder="مثال: اربط كل فيلسوف بأطروحته أو مقولته الشهيرة" class="w-full px-3 py-2 border-2 border-slate-900 text-xs font-bold">
          </div>

          <div class="pt-2 border-t border-slate-200">
            <div class="flex items-center justify-between mb-2">
              <label class="block text-xs font-black">أزواج البطاقات (البطاقة أمامها الزوج):</label>
              <button type="button" onclick="addMatchingPair()" class="text-xs font-black text-emerald-700 hover:underline flex items-center gap-1">
                <span>+ إضافة زوج جديد</span>
              </button>
            </div>
            <div class="space-y-2">
              ${pairsHtml}
            </div>
          </div>

          <div class="flex gap-2 pt-3 border-t">
            <button onclick="saveMatchingGame()" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs pixel-bevel pixel-press">${matchFormState.editingId ? 'حفظ التعديلات ✓' : 'حفظ لعبة البطاقات وتوليد الرابط'}</button>
            <button onclick="showAdmin()" class="px-4 py-2 border border-slate-900 text-xs font-bold">إلغاء</button>
          </div>
        </div>
      `;
    }

    function addMatchingPair() {
      matchFormState.pairs.push({ itemA: '', itemB: '' });
      renderMatchingForm();
    }

    function removeMatchingPair(idx) {
      if (matchFormState.pairs.length <= 2) {
        alert("يجب توفر زوجين على الأقل للعبة المطابقة!");
        return;
      }
      matchFormState.pairs.splice(idx, 1);
      renderMatchingForm();
    }

    function saveMatchingGame() {
      const title = (matchFormState.title || '').trim();
      const cat = (matchFormState.category || 'فلسفة').trim();
      const desc = (matchFormState.description || 'اربط كل فيلسوف بأطروحته الفلسفية!').trim();

      const suits = ['♥', '♦', '♣', '♠'];
      const validPairs = [];
      matchFormState.pairs.forEach((p, i) => {
        const a = (p.itemA || '').trim();
        const b = (p.itemB || '').trim();
        if (a && b) {
          validPairs.push({
            id: `p_${i + 1}_${Date.now()}`,
            itemA: a,
            itemB: b,
            suit: suits[i % suits.length]
          });
        }
      });

      if (!title || validPairs.length < 2) {
        alert("يرجى كتابة عنوان اللعبة وملء زوجين كاملين من البطاقات على الأقل!");
        return;
      }

      if (matchFormState.editingId) {
        const item = currentQuizzes.find(x => x.id === matchFormState.editingId);
        if (item) {
          item.title = title;
          item.category = cat;
          item.description = desc;
          item.matchingPairs = validPairs;
          saveStorageQuizzes(currentQuizzes);
          alert("تم حفظ تعديلات لعبة البطاقات بنجاح!");
          showAdmin();
          return;
        }
      }

      const newGame = {
        id: `match_${Date.now()}`,
        title,
        category: cat,
        description: desc,
        blogType: 'matching_cards',
        matchingPairs: validPairs,
        questions: []
      };

      currentQuizzes.unshift(newGame);
      saveStorageQuizzes(currentQuizzes);
      alert("تم إنشاء لعبة مطابقة البطاقات بنجاح!");
      showAdmin();
    }

    // Initialize View based on URL params or show Home
    const urlParams = new URLSearchParams(window.location.search);
    const quizParam = urlParams.get('quiz');
    if (quizParam) {
      startActivity(quizParam);
    } else {
      showHome();
    }
  </script>
</body>
</html>
