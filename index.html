    function playCorrectSound() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const notes = [523.25, 659.25, 783.99, 1046.5];
      const now = audioCtx.currentTime;
      notes.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(f, now + i * 0.08);
        gain.gain.setValueAtTime(0.2, now + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);

        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.08);
        osc.stop(now + i * 0.08 + 0.32);
      });
    }

    function startActivity(id) {
      const item = currentQuizzes.find(x => x.id === id) || currentQuizzes[0];
      if (item.blogType === 'matching_cards') {
        startMatchingGame(item);
      } else if (item.blogType === 'training') {
        showTrainingIntro(item);
      } else {
        startQuiz(item);
      }

    // ==========================================
    // 🃏 Matching Cards Game Implementation
    // ==========================================
    let activeMatchingGame = null;
    let matchingCards = [];
    let selectedFirstCard = null;
    let matchedPairs = [];
    let matchingMistakes = 0;
    let isMatchingProcessing = false;

    function startMatchingGame(game) {
      activeMatchingGame = game;
      matchedPairs = [];
      matchingMistakes = 0;
      selectedFirstCard = null;
      isMatchingProcessing = false;

      // Build and shuffle cards
      const suits = ['♥', '♦', '♣', '♠'];
      const raw = [];
      (game.matchingPairs || []).forEach((p, i) => {
        const suit = p.suit || suits[i % suits.length];
        raw.push({ id: `card-${p.id}-A`, pairId: p.id, text: p.itemA, side: 'A', suit });
        raw.push({ id: `card-${p.id}-B`, pairId: p.id, text: p.itemB, side: 'B', suit });
      });

      // Shuffle
      for (let i = raw.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [raw[i], raw[j]] = [raw[j], raw[i]];
      }
      matchingCards = raw;

      renderMatchingView();
    }

          </div>
        </div>
      `;

    function handleMatchingCardClick(cardId) {
      if (isMatchingProcessing) return;
      const card = matchingCards.find(c => c.id === cardId);
      if (!card || matchedPairs.includes(card.pairId)) return;
      if (selectedFirstCard && selectedFirstCard.id === card.id) return;

      if (!selectedFirstCard) {
        selectedFirstCard = card;
        renderMatchingView();
        return;
      }

      // Second card clicked -> Compare
      isMatchingProcessing = true;
      const el1 = document.getElementById(selectedFirstCard.id);
      const el2 = document.getElementById(card.id);

      if (selectedFirstCard.pairId === card.pairId) {
        // MATCH!
        playCorrectSound();
        matchedPairs.push(card.pairId);
        selectedFirstCard = null;
        isMatchingProcessing = false;
        renderMatchingView();

        if (matchedPairs.length === activeMatchingGame.matchingPairs.length) {
          setTimeout(renderMatchingWin, 500);
        }
      } else {
        // MISMATCH! Shake & sound
        playWrongSound();
        matchingMistakes++;
        if (el1) el1.classList.add('card-shaking', 'bg-rose-50', 'border-rose-600');
        if (el2) el2.classList.add('card-shaking', 'bg-rose-50', 'border-rose-600');

        setTimeout(() => {
          selectedFirstCard = null;
          isMatchingProcessing = false;
          renderMatchingView();
        }, 650);
      }
    }

    // Modal 2: Multi-Question Standard Quiz Editor Dialog
    let quizEditorState = {
      editingId: null,
      title: '',
      category: '',
      targetGrade: 'بكالوريا 2025',
      description: '',
      questions: []
    };

    function openStandardQuizEditor(quizId) {
      if (quizId) {
        const item = currentQuizzes.find(x => x.id === quizId);
        if (item) {
          quizEditorState = {
            editingId: item.id,
            title: item.title || '',
            category: item.category || 'فلسفة',
            targetGrade: item.targetGrade || 'بكالوريا 2025',
            description: item.description || '',
            questions: (item.questions && item.questions.length > 0)
              ? item.questions.map(q => ({
                  q: q.q || q.question || '',
                  options: q.options && q.options.length >= 2 ? [...q.options] : ['', ''],
                  correct: typeof q.correct === 'number' ? q.correct : (q.correctIndex || 0),
                  exp: q.exp || q.explanation || ''
                }))
              : [{ q: '', options: ['', '', '', ''], correct: 0, exp: '' }]
          };
        }
      } else {
        quizEditorState = {
          editingId: null,
          title: '',
          category: 'فلسفة',
          targetGrade: 'بكالوريا 2025',
          description: '',
          questions: [
            { q: '', options: ['', '', '', ''], correct: 0, exp: '' }
          ]
        };
      }

      renderQuizEditorModal();
    }

    function renderQuizEditorModal() {

                عنوان الكويز * (مثال: تحدي الفلسفة للبكالوريا)
              </label>
              <input
                type="text"
                value="${quizEditorState.title.replace(/"/g, '&quot;')}"
                oninput="quizEditorState.title = this.value"

                value="${quizEditorState.description.replace(/"/g, '&quot;')}"

    function addQuizQuestionToEditor() {
      quizEditorState.questions.push({
        q: '',
        options: ['', '', '', ''],
        correct: 0,
        exp: ''
      });
      renderQuizEditorModal();
    }

    function removeQuizQuestionFromEditor(qIdx) {
      if (quizEditorState.questions.length <= 1) {
        alert("يجب توفر سؤال واحد على الأقل!");
        return;
      }
      quizEditorState.questions.splice(qIdx, 1);
      renderQuizEditorModal();
    }

    function addQuizOptionToEditor(qIdx) {
      const q = quizEditorState.questions[qIdx];
      if (q.options.length >= 6) {
        alert("الحد الأقصى للخيارات هو 6 خيارات.");
        return;
      }
      q.options.push('');
      renderQuizEditorModal();
    }

    function removeQuizOptionFromEditor(qIdx, optIdx) {
      const q = quizEditorState.questions[qIdx];
      if (q.options.length <= 2) {
        alert("يجب توفر خيارين على الأقل في السؤال!");
        return;
      }
      q.options.splice(optIdx, 1);
      if (q.correct >= q.options.length) {
        q.correct = q.options.length - 1;
      }
      renderQuizEditorModal();
    }

    function saveQuizEditorModal() {
      const title = (quizEditorState.title || '').trim();
      const cat = (quizEditorState.category || 'فلسفة').trim();

      if (!title) {
        alert("الرجاء إدخال عنوان الكويز!");
        return;
      }

      for (let i = 0; i < quizEditorState.questions.length; i++) {
        const q = quizEditorState.questions[i];
        if (!q.q.trim()) {
          alert(`السؤال ${i + 1} لا يحتوي على نص السؤال!`);
          return;
        }
        const filled = q.options.filter(o => o.trim().length > 0);
        if (filled.length < 2) {
          alert(`السؤال ${i + 1} يجب أن يحتوي على خيارين على الأقل!`);
          return;
        }
      }

      const validQuestions = quizEditorState.questions.map((q, idx) => ({
        id: `q_${idx + 1}_${Date.now()}`,
        q: q.q.trim(),
        options: q.options.map(o => o.trim()).filter(Boolean),
        correct: Math.min(q.correct, q.options.filter(Boolean).length - 1),
        exp: (q.exp || '').trim() || 'إضاءة فلسفية خاصة بالبكالوريا.'
      }));

      let savedSlug = quizEditorState.editingId || `quiz_${Date.now()}`;

      if (quizEditorState.editingId) {
        const item = currentQuizzes.find(x => x.id === quizEditorState.editingId);
        if (item) {
          item.title = title;
          item.category = cat;
          item.targetGrade = quizEditorState.targetGrade;
          item.description = quizEditorState.description;
          item.questions = validQuestions;
        }
      } else {
        const newQuiz = {
          id: savedSlug,
          title,
          category: cat,
          targetGrade: quizEditorState.targetGrade,
          description: quizEditorState.description || 'مدونة تفاعلية للبكالوريا عبر واتساب.',
          blogType: 'standard',
          questions: validQuestions,
          timesPlayed: 0,
          averageScore: 0
        };
        currentQuizzes.unshift(newQuiz);
      }

      saveStorageQuizzes(currentQuizzes);
      closeModal();
      showAdmin();

      // Show Created Share Modal
      const uniqueLink = `${window.location.origin}${window.location.pathname}?quiz=${savedSlug}`;
      openShareModal({ title }, uniqueLink);
    }

    // Modal 3: Matching Cards Game Editor Dialog
    let matchEditorState = {
      editingId: null,
      title: '',
      category: '',
      description: '',
      pairs: []
    };

    function openMatchingCardsEditor(gameId) {
      if (gameId) {
        const item = currentQuizzes.find(x => x.id === gameId);
        if (item) {
          matchEditorState = {
            editingId: item.id,
            title: item.title || '',
            category: item.category || 'فلسفة',
            description: item.description || '',
            pairs: (item.matchingPairs && item.matchingPairs.length > 0)
              ? item.matchingPairs.map(p => ({ itemA: p.itemA || '', itemB: p.itemB || '', suit: p.suit || '♥' }))
              : [
                  { itemA: '', itemB: '', suit: '♥' },
                  { itemA: '', itemB: '', suit: '♦' }
                ]
          };
        }
      } else {
        matchEditorState = {
          editingId: null,
          title: '',
          category: 'فلسفة',
          description: 'اضغط على كل فيلسوف وطابقه مع أطروحته الفلسفية الشهيرة',
          pairs: [
            { itemA: '', itemB: '', suit: '♥' },
            { itemA: '', itemB: '', suit: '♦' },
            { itemA: '', itemB: '', suit: '♣' },
            { itemA: '', itemB: '', suit: '♠' }
          ]
        };
      }

      renderMatchingEditorModal();
    }

                  type="button"

    function addMatchingPairToEditor() {
      const suits = ['♥', '♦', '♣', '♠'];
      const nextSuit = suits[matchEditorState.pairs.length % suits.length];
      matchEditorState.pairs.push({ itemA: '', itemB: '', suit: nextSuit });
      renderMatchingEditorModal();
    }

    function removeMatchingPairFromEditor(idx) {
      if (matchEditorState.pairs.length <= 2) {
        alert("يجب توفر زوجين على الأقل للعبة المطابقة!");
        return;
      }
      matchEditorState.pairs.splice(idx, 1);
      renderMatchingEditorModal();
    }

    function saveMatchingEditorModal() {
      const title = (matchEditorState.title || '').trim();
      const cat = (matchEditorState.category || 'فلسفة').trim();
      const desc = (matchEditorState.description || 'اربط كل فيلسوف بأطروحته!').trim();

      const suits = ['♥', '♦', '♣', '♠'];
      const validPairs = [];
      matchEditorState.pairs.forEach((p, i) => {
        const a = (p.itemA || '').trim();
        const b = (p.itemB || '').trim();
        if (a && b) {
          validPairs.push({
            id: `p_${i + 1}_${Date.now()}`,
            itemA: a,
            itemB: b,
            suit: suits[i % suits.length]
          });
        }
      });

      if (!title || validPairs.length < 2) {
        alert("يرجى كتابة عنوان اللعبة وملء زوجين كاملين من البطاقات على الأقل!");
        return;
      }

      let savedSlug = matchEditorState.editingId || `match_${Date.now()}`;

      if (matchEditorState.editingId) {
        const item = currentQuizzes.find(x => x.id === matchEditorState.editingId);
        if (item) {
          item.title = title;
          item.category = cat;
          item.description = desc;
          item.matchingPairs = validPairs;
        }
      } else {
        const newGame = {
          id: savedSlug,
          title,
          category: cat,
          description: desc,
          blogType: 'matching_cards',
          matchingPairs: validPairs,
          questions: [],
          timesPlayed: 0,
          averageScore: 0
        };
        currentQuizzes.unshift(newGame);
      }

      saveStorageQuizzes(currentQuizzes);
      closeModal();
      showAdmin();

      const uniqueLink = `${window.location.origin}${window.location.pathname}?quiz=${savedSlug}`;
      openShareModal({ title }, uniqueLink);

          editingTrainingCategory = q.category || 'الإنية والغيرية';
          editingTrainingHeadline = q.introHeadline || q.title || '';
          editingTrainingDesc = q.description || '';
          if (q.questions && q.questions.length > 0) {
            editingTrainingSteps = q.questions.map(s => ({
              q: s.q || s.question || '',
              options: (s.options && s.options.length > 0) ? [...s.options] : ['', '', ''],
              correct: s.correct !== undefined ? s.correct : (s.correctIndex || 0),
              exp: s.exp || s.explanation || ''
            }));
          } else {
            editingTrainingSteps = [
              { q: '', options: ['', '', ''], correct: 0, exp: '' }
            ];
          }
        }
      } else {
        editingTrainingTitle = '';
        editingTrainingCategory = 'الإنية والغيرية';
        editingTrainingHeadline = '';
        editingTrainingDesc = '';
        editingTrainingSteps = [
          { q: '', options: ['', '', ''], correct: 0, exp: '' }
        ];
      }

      renderTrainingEditorModal();
    }

    function renderTrainingEditorModal() {
      let stepsHtml = '';
      editingTrainingSteps.forEach((s, sIdx) => {
        let optsHtml = '';
        s.options.forEach((opt, optIdx) => {
          optsHtml += `
            <div class="flex items-center gap-2 p-1.5 border ${s.correct === optIdx ? 'border-sky-500 bg-sky-50' : 'border-slate-300 bg-white'}">
              <input
                type="radio"
                name="correct_sheet_${sIdx}"
                ${s.correct === optIdx ? 'checked' : ''}
                onchange="editingTrainingSteps[${sIdx}].correct = ${optIdx}; renderTrainingEditorModal();"
                title="تحديد كإجابة صحيحة للإصلاح"
                class="w-4 h-4 cursor-pointer"
              />
              <span class="text-xs font-bold text-slate-500 w-5 text-center">${['أ', 'ب', 'ج', 'د', 'هـ', 'و'][optIdx] || optIdx + 1}</span>
              <input
                type="text"
                value="${(opt || '').replace(/"/g, '&quot;')}"
                oninput="editingTrainingSteps[${sIdx}].options[${optIdx}] = this.value"
                placeholder="الخيار ${optIdx + 1}..."
                class="flex-1 text-xs px-2 py-1.5 border border-slate-300 rounded-none bg-white font-medium"
              />
              ${s.correct === optIdx ? `
                <span class="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-1.5 py-0.5 shrink-0">صحيح ✓</span>
              ` : ''}
              ${s.options.length > 2 ? `
                <button
                  type="button"
                  onclick="removeTrainingOption(${sIdx}, ${optIdx})"
                  class="px-2 py-1 text-xs font-bold text-rose-600 hover:text-rose-800 bg-rose-50 hover:bg-rose-100 border border-rose-300 shrink-0 cursor-pointer"
                  title="حذف هذا الخيار (تقليص الخيارات إلى 3 أو 2)"
                >
                  ✕ حذف
                </button>
              ` : ''}
            </div>
          `;
        });

        stepsHtml += `
          <div class="p-3.5 border-2 border-slate-800 bg-slate-50 space-y-3 pixel-shadow">
            <div class="flex items-center justify-between border-b border-slate-300 pb-1.5">
              <div class="flex items-center gap-2">
                <span class="text-xs font-black bg-sky-600 text-white px-2.5 py-0.5 pixel-bevel">
                  ورقة العمل #${sIdx + 1}
                </span>
                <span class="text-xs text-slate-500 font-bold">
                  (المرحلة ${sIdx + 1} من ${editingTrainingSteps.length})
                </span>
              </div>
              ${editingTrainingSteps.length > 1 ? `
                <button
                  type="button"
                  onclick="removeTrainingStep(${sIdx})"
                  class="text-rose-600 hover:text-rose-800 text-xs font-bold px-2 py-0.5 bg-rose-50 border border-rose-200 cursor-pointer"
                >
                  ✕ حذف هذه الورقة
                </button>
              ` : ''}
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-900 mb-1">نص الورقة / السؤال الفلسفي: *</label>
              <textarea
                rows="2"
                oninput="editingTrainingSteps[${sIdx}].q = this.value"
                class="w-full text-xs p-2.5 border border-slate-400 bg-white font-medium"
                placeholder="اكتب الإقرار أو السؤال الفلسفي المطلوب تحليله..."
              >${s.q || ''}</textarea>
            </div>

            <div class="space-y-2">
              <div class="flex items-center justify-between">
                <label class="text-xs font-bold text-slate-800">خيارات الإجابة (${s.options.length} خيارات - حدد الدائرة للإجابة الصحيحة):</label>
                <button
                  type="button"
                  onclick="addTrainingOption(${sIdx})"
                  class="px-2 py-0.5 text-xs font-bold text-sky-700 hover:text-sky-900 bg-sky-50 border border-sky-300 hover:bg-sky-100 cursor-pointer flex items-center gap-1"
                >
                  + خيار إضافي
                </button>
              </div>
              <div class="space-y-1.5">
                ${optsHtml}
              </div>
            </div>

            <div>
              <label class="block text-[11px] font-bold text-slate-600 mb-1">إضاءة فلسفية وتفسير للإصلاح (يظهر للطالب عند كشف الإصلاح):</label>
              <input
                type="text"
                value="${(s.exp || '').replace(/"/g, '&quot;')}"
                oninput="editingTrainingSteps[${sIdx}].exp = this.value"
                placeholder="تعليل سياق الموقف الفلسفي..."
                class="w-full text-xs p-2 border border-slate-300 bg-white"
              />
            </div>
          </div>
        `;
      });

      const modalHtml = `
        <div class="bg-white border-2 border-slate-900 max-w-2xl w-full max-h-[92vh] flex flex-col pixel-shadow my-auto">
          <div class="p-4 border-b border-slate-300 bg-sky-50 flex items-center justify-between">
            <div>
              <h3 class="text-base font-black text-sky-950">
                ${editingTrainingQuizId ? 'تعديل التدريب التطبيقي' : 'إنشاء تدريب تطبيقي جديد (أوراق عمل متتالية)'}
              </h3>
              <p class="text-xs text-slate-600 mt-0.5">
                أوراق عمل تفاعلية هادئة باللون الأزرق الفاتح تتيح للتلميذ الإجابة وسحب الإصلاح في النهاية.
              </p>
            </div>
            <button type="button" onclick="closeModal()" class="text-slate-500 hover:text-slate-900 font-black p-1 text-sm">✕</button>
          </div>

          <div class="p-5 overflow-y-auto space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold mb-1">عنوان التدريب *</label>
                <input
                  type="text"
                  id="trainTitleInput"
                  value="${(editingTrainingTitle || '').replace(/"/g, '&quot;')}"
                  oninput="editingTrainingTitle = this.value"
                  placeholder="مثال: تدريب منهجي: تفكيك الإشكالية الفلسفية"
                  class="w-full text-xs p-2 border border-slate-400 font-bold"
                />
              </div>
              <div>
                <label class="block text-xs font-bold mb-1">المحور / الدرس</label>
                <input
                  type="text"
                  id="trainCategoryInput"
                  value="${(editingTrainingCategory || '').replace(/"/g, '&quot;')}"
                  oninput="editingTrainingCategory = this.value"
                  class="w-full text-xs p-2 border border-slate-400 font-bold"
                />
              </div>
            </div>

            <!-- Custom Headline for Intro Page -->
            <div>
              <label class="block text-xs font-black text-sky-900 mb-1">
                جملة البداية التفاعلية العريضة (تظهر في صفحة الانطلاق بجانب القلم الأسود) *
              </label>
              <input
                type="text"
                id="trainHeadlineInput"
                value="${(editingTrainingHeadline || '').replace(/"/g, '&quot;')}"
                oninput="editingTrainingHeadline = this.value"
                placeholder="اكتب جملة البداية العريضة التي تود أن يراها التلميذ..."
                class="w-full text-xs p-2 border-2 border-sky-500 font-black"
              />
            </div>

            <div>
              <label class="block text-xs font-bold mb-1">وصف أو توجيه (اختياري)</label>
              <input
                type="text"
                id="trainDescInput"
                value="${(editingTrainingDesc || '').replace(/"/g, '&quot;')}"
                oninput="editingTrainingDesc = this.value"
                placeholder="وصف مختصر للتدريب..."
                class="w-full text-xs p-1.5 border border-slate-300"
              />
            </div>

            <!-- Sheets list -->
            <div class="space-y-3 pt-2">
              <div class="flex items-center justify-between bg-sky-50 p-2 border border-sky-200">
                <span class="text-xs font-black text-slate-900">
                  أوراق العمل المتتابعة (${editingTrainingSteps.length} أوراق):
                </span>
                <button
                  type="button"
                  onclick="addTrainingStep()"
                  class="px-3 py-1.5 bg-sky-600 hover:bg-sky-700 text-white text-xs font-black pixel-bevel pixel-press cursor-pointer flex items-center gap-1"
                >
                  + إضافة ورقة عمل جديدة
                </button>
              </div>

              <div class="space-y-3">
                ${stepsHtml}
              </div>
            </div>

            <div class="pt-4 border-t flex items-center justify-between">
              <button
                type="button"
                onclick="saveTrainingEditorModal()"
                class="px-6 py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-black text-xs pixel-bevel pixel-shadow pixel-press cursor-pointer"
              >
                ${editingTrainingQuizId ? 'حفظ التعديلات' : 'حفظ التدريب وتوليد الرابط'}
              </button>
              <button
                type="button"
                onclick="closeModal()"
                class="px-4 py-2 border border-slate-400 text-xs font-bold hover:bg-slate-100 cursor-pointer"
              >
                إلغاء
              </button>
            </div>
          </div>
        </div>
      `;

      openModal(modalHtml);
    }

    function addTrainingStep() {
      syncTrainingHeaderInputs();
      playClick();
      editingTrainingSteps.push({
        q: '',
        options: ['', '', ''],
        correct: 0,
        exp: ''
      });
      renderTrainingEditorModal();
    }

    function removeTrainingStep(idx) {
      syncTrainingHeaderInputs();
      playClick();
      if (editingTrainingSteps.length <= 1) {
        alert('يجب توفر ورقة تدريب واحدة على الأقل');
        return;
      }
      editingTrainingSteps.splice(idx, 1);
      renderTrainingEditorModal();
    }

    function addTrainingOption(stepIdx) {
      syncTrainingHeaderInputs();
      playClick();
      if (editingTrainingSteps[stepIdx].options.length >= 6) {
        alert('الحد الأقصى هو 6 خيارات');
        return;
      }
      editingTrainingSteps[stepIdx].options.push('');
      renderTrainingEditorModal();
    }

    function removeTrainingOption(stepIdx, optIdx) {
      syncTrainingHeaderInputs();
      playClick();
      if (editingTrainingSteps[stepIdx].options.length <= 2) {
        alert('يجب توفر خيارين على الأقل (أ وب) لكل سؤال');
        return;
      }
      editingTrainingSteps[stepIdx].options.splice(optIdx, 1);
      if (editingTrainingSteps[stepIdx].correct >= editingTrainingSteps[stepIdx].options.length) {
        editingTrainingSteps[stepIdx].correct = editingTrainingSteps[stepIdx].options.length - 1;
      }
      renderTrainingEditorModal();
    }

    function saveTrainingEditorModal() {
      syncTrainingHeaderInputs();
      playClick();

      const title = (editingTrainingTitle || '').trim();
      const cat = (editingTrainingCategory || '').trim() || 'فلسفة';
      const headline = (editingTrainingHeadline || '').trim() || title;
      const desc = (editingTrainingDesc || '').trim();

      if (!title) {
        alert('يرجى كتابة عنوان التدريب التطبيقي أولاً!');
        document.getElementById('trainTitleInput')?.focus();
        return;
      }

      if (!headline) {
        alert('يرجى كتابة جملة البداية العريضة التي تظهر في صفحة الانطلاق!');
        document.getElementById('trainHeadlineInput')?.focus();
        return;
      }

      if (!editingTrainingSteps || editingTrainingSteps.length === 0) {
        alert('يجب إضافة ورقة تدريب واحدة على الأقل!');
        return;
      }

      for (let i = 0; i < editingTrainingSteps.length; i++) {
        const s = editingTrainingSteps[i];
        if (!s.q || !s.q.trim()) {
          alert(`الورقة رقم ${i + 1}: يرجى كتابة نص السؤال أو المسألة الفلسفية!`);
          return;
        }
        const validOpts = (s.options || []).filter(o => o && o.trim().length > 0);
        if (validOpts.length < 2) {
          alert(`الورقة رقم ${i + 1}: يجب إدخال خيارين صالحين على الأقل (مثلاً خيار أ وخيار ب)!`);
          return;
        }
      }

      const cleanQuestions = editingTrainingSteps.map((s, idx) => {
        const validOpts = s.options.map(o => o.trim()).filter(Boolean);
        let correct = s.correct;
        if (correct >= validOpts.length) {
          correct = 0;
        }
        return {
          id: `t_${idx + 1}_${Date.now()}`,
          q: s.q.trim(),
          options: validOpts,
          correct: correct,
          exp: s.exp?.trim() || 'إضاءة فلسفية توضيحية للورقة التدريبية.'
        };
      });

      const newTraining = {
        id: editingTrainingQuizId || `train_${Date.now()}`,
        title: title,
        category: cat,
        introHeadline: headline,
        description: desc,
        blogType: 'training',
        questions: cleanQuestions,
        matchingPairs: [],
        timesPlayed: 0,
        averageScore: 100
      };

      if (editingTrainingQuizId) {
        const idx = currentQuizzes.findIndex(x => x.id === editingTrainingQuizId);
        if (idx !== -1) currentQuizzes[idx] = newTraining;
        else currentQuizzes.unshift(newTraining);
      } else {
        currentQuizzes.unshift(newTraining);
      }

      saveStorageQuizzes(currentQuizzes);
      closeModal();
      showAdmin();

      // Show Share Dialog
      const shareLink = `${window.location.origin}${window.location.pathname}?quiz=${newTraining.id}`;
      if (typeof openShareModal === 'function') {
        openShareModal(newTraining, shareLink);
      }
    }

    // Initialize View based on URL params or show Home
    const urlParams = new URLSearchParams(window.location.search);
    const quizParam = urlParams.get('quiz');
    if (quizParam) {
      startActivity(quizParam);
    } else {
      showHome();
    }
  </script>
</body>
</html>
