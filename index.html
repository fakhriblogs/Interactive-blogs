    // Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playCorrectSound() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const notes = [523.25, 659.25, 783.99, 1046.5];
      const now = audioCtx.currentTime;
      notes.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(f, now + i * 0.08);
        gain.gain.setValueAtTime(0.2, now + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.08);
        osc.stop(now + i * 0.08 + 0.32);
      });
    }

    function playWrongSound() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.exponentialRampToValueAtTime(90, now + 0.45);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.46);
    }

    function getStorageQuizzes() {
      try {
        const stored = localStorage.getItem('fakhri_blogs_v4');
        return stored ? JSON.parse(stored) : initialQuizzes;

    function startQuiz(quizId) {
      activeQuiz = currentQuizzes.find(x => x.id === quizId) || currentQuizzes[0];
      currentQIdx = 0;
      score = 0;
      selectedOpt = null;
      isAnswered = false;
      renderQuestion();
    }

    function renderQuestion() {
      const app = document.getElementById('app');
      const q = activeQuiz.questions[currentQIdx];
      const total = activeQuiz.questions.length;
      const progressPercent = Math.round(((currentQIdx + (isAnswered ? 1 : 0)) / total) * 100);

      const letters = ['أ', 'ب', 'ج', 'د'];

      let optionsHtml = '';
      q.options.forEach((opt, idx) => {
        let style = 'bg-white border-2 border-slate-900 hover:bg-slate-50';
        if (isAnswered) {
          if (idx === q.correct) {
            style = 'bg-emerald-100 border-2 border-emerald-600 font-bold text-emerald-950';
          } else if (selectedOpt === idx && idx !== q.correct) {
            style = 'bg-rose-100 border-2 border-rose-600 text-rose-950 line-through';
          } else {
            style = 'bg-slate-100 border-slate-300 opacity-50';

        } else {

            <div class="my-4 p-4 bg-rose-50 border-2 border-rose-600 pixel-shadow flex items-center gap-4">
              <div class="w-16 h-16 bg-rose-900/15 border-2 border-rose-700 pixel-shadow flex items-center justify-center shrink-0 overflow-hidden relative">
                <svg viewBox="0 0 64 64" class="w-14 h-14 overflow-visible">
                  <!-- Upright Left Lobe Half -->
                  <g class="heart-half-left">
                    <path d="M 32 20 C 24 10, 10 10, 6 22 C 2 34, 16 46, 32 54 L 32 44 L 28 38 L 32 32 L 28 26 L 32 20 Z" fill="#E11D48" stroke="#9F1239" stroke-width="2" stroke-linejoin="round" />
                    <path d="M 12 18 C 10 23, 11 29, 15 35" stroke="#FDA4AF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85" />
                  </g>
                  <!-- Upright Right Lobe Half -->
                  <g class="heart-half-right">
                    <path d="M 32 20 L 28 26 L 32 32 L 28 38 L 32 44 L 32 54 C 48 46, 62 34, 58 22 C 54 10, 40 10, 32 20 Z" fill="#E11D48" stroke="#9F1239" stroke-width="2" stroke-linejoin="round" />
                  </g>
                </svg>
              </div>
              <div class="flex-1">
                <h4 class="text-xl font-black text-rose-700">إجابة خاطئة! حظ أوفر</h4>
                <div class="text-xs md:text-sm font-bold text-rose-950 mt-1">✅ <strong>الإجابة الصحيحة:</strong> ${q.options[q.correct]}</div>
                ${q.exp ? `<p class="text-xs text-rose-800 mt-1 font-medium">💡 ${q.exp}</p>` : ''}
              </div>
            </div>
          `;
        }
      }

      app.innerHTML = `
        <div class="flex flex-col flex-1 pb-16">
          <div class="flex items-center justify-between py-2 border-b-2 border-slate-200 mb-3 text-xs font-black text-slate-600">
            <span class="bg-amber-100 text-amber-900 px-2 py-0.5 border border-amber-300">السؤال ${currentQIdx + 1} من ${total}</span>
            <span>النتيجة الحالية: <strong class="text-emerald-700">${score}</strong></span>
          </div>

          <div class="bg-white border-2 border-slate-900 p-5 pixel-shadow mb-4">
            <span class="bg-slate-900 text-white font-black px-2 py-0.5 text-xs inline-block mb-2">السؤال ${currentQIdx + 1}</span>
            <h2 class="text-base md:text-lg font-black text-slate-900 leading-relaxed">${q.q}</h2>
          </div>

          <div class="space-y-3 mb-2">
            ${optionsHtml}
          </div>

          ${feedbackHtml}

          ${isAnswered ? `
            <button onclick="nextQuestion()" class="w-full mt-3 py-3 bg-amber-600 hover:bg-amber-700 text-white font-black text-base pixel-bevel pixel-press">
              ${currentQIdx + 1 < total ? 'الانتقال إلى السؤال التالي ➔' : 'عرض النتيجة النهائية 🏆'}
            </button>
          ` : ''}
        </div>

        <!-- Persistent Bottom Progress Bar -->
        <div class="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-slate-900 p-2 pixel-shadow z-20">
          <div class="max-w-xl mx-auto flex items-center gap-3">
            <span class="text-[11px] font-black text-slate-600">${progressPercent}%</span>
            <div class="flex-1 h-3 bg-slate-200 border border-slate-900 overflow-hidden">
              <div class="h-full bg-emerald-500 transition-all duration-300" style="width: ${progressPercent}%"></div>
            </div>
            <span class="text-[11px] font-bold text-slate-600">${currentQIdx + 1}/${total}</span>
          </div>
        </div>
      `;
    }

    function pickOption(idx) {
      if (isAnswered) return;
      selectedOpt = idx;
      isAnswered = true;
      const q = activeQuiz.questions[currentQIdx];
      if (idx === q.correct) {
        score++;
        playCorrectSound();
      } else {
        playWrongSound();
      }
      renderQuestion();
    }

    function nextQuestion() {
      if (currentQIdx + 1 < activeQuiz.questions.length) {
        currentQIdx++;
        selectedOpt = null;
        isAnswered = false;
        renderQuestion();
      } else {
        renderResults();
      }
    }

    function renderResults() {
      const app = document.getElementById('app');
      const total = activeQuiz.questions.length;
      const percent = Math.round((score / total) * 100);

      app.innerHTML = `
        <div class="flex-1 flex flex-col items-center justify-center py-6 text-center">
          <div class="bg-white border-2 border-slate-900 p-6 pixel-shadow w-full max-w-md">
            <div class="w-16 h-16 mx-auto mb-3 bg-gradient-to-br from-amber-300 to-amber-600 border-2 border-amber-700 pixel-shadow flex items-center justify-center gold-cup-animation">
              <span class="text-3xl">🏆</span>
            </div>
            <h2 class="text-2xl font-black text-slate-900 mb-1">اكتملت المدونة التفاعلية بنجاح!</h2>
            <p class="text-xs text-slate-500 mb-4">${activeQuiz.title}</p>
            <div class="bg-slate-100 border-2 border-slate-900 p-4 my-3 pixel-shadow">
              <div class="text-4xl font-black text-amber-600 mb-1">${score} / ${total}</div>
              <div class="text-sm font-bold text-slate-600">النسبة المئوية: <span class="font-black text-slate-900">${percent}%</span></div>
            </div>
            <p class="p-2.5 bg-amber-50 border border-amber-300 text-amber-950 font-bold text-xs mb-4">
              ${score === total ? '🔥 أداء أسطوري! أنت جاهز للتميز في البكالوريا!' : '👏 أحسنت! بالمراجعة والتكرار تترسخ المفاهيم.'}
            </p>
            <div class="space-y-2.5">
              <button onclick="shareWhatsAppResult(${score}, ${total}, '${activeQuiz.title}')" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm pixel-bevel pixel-press flex items-center justify-center gap-2">
                <span>مشاركة النتيجة في واتساب 📋</span>
              </button>
              <button onclick="startQuiz('${activeQuiz.id}')" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 border-2 border-slate-900 font-bold text-xs pixel-press">
                إعادة خوض المدونة التفاعلية ↺
              </button>
              <button onclick="showHome()" class="w-full py-2 text-xs font-bold text-slate-600 hover:underline">
                تصفح باقي مدونات فخري
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function shareWhatsAppResult(s, tot, title) {
      const p = Math.round((s / tot) * 100);
      const text = `🎯 مدونة فلسفية تفاعلية - مدونات فخري: *${title}*\n` +
        `📊 نتيجتي: ${s} من ${tot} (${p}%)\n` +
        `⚡ اختبر معلوماتك الآن:\n${window.location.href}`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
    }

    // Admin Panel (Password completely hidden from UI)
    let isAdminAuth = false;
    const ADMIN_PASS = 'bac2025';

    function showAdmin() {
      const app = document.getElementById('app');
      if (!isAdminAuth) {
        app.innerHTML = `
          <div class="bg-white border-2 border-slate-900 p-6 pixel-shadow max-w-md w-full mx-auto my-auto">
            <h2 class="text-xl font-black text-slate-900 mb-1 text-center">لوحة التحكم</h2>
            <p class="text-xs text-slate-600 mb-5 text-center">منطقة محمية خاصة بالأستاذ لإدارة المدونات التفاعلية</p>
            <input type="password" id="adminPass" placeholder="أدخل رمز المرور السري..." class="w-full px-3 py-2.5 border-2 border-slate-900 text-sm font-bold mb-4 focus:outline-none">
            <button onclick="checkAdminPass()" class="w-full py-2.5 bg-amber-600 hover:bg-amber-700 text-white font-black text-sm border-2 border-slate-900 pixel-bevel pixel-press">
              دخول لوحة التحكم
            </button>
            <button onclick="showHome()" class="w-full mt-2.5 py-1.5 text-xs text-slate-500 font-bold">العودة للرئيسية</button>
          </div>
        `;
        return;
      }

      // Admin Quizzes Manager
      let listHtml = '';
      currentQuizzes.forEach((item, idx) => {
        listHtml += `
          <div class="bg-white border-2 border-slate-900 p-3 pixel-shadow flex items-center justify-between gap-2">
            <div>
              <span class="text-[10px] font-black bg-amber-100 text-amber-900 px-1.5 py-0.5 border border-amber-300">${item.category}</span>
              <h4 class="text-sm font-black text-slate-900 mt-1">${item.title}</h4>
              <span class="text-[11px] text-slate-500">${item.questions.length} أسئلة</span>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="copyQuizLink('${item.id}', '${item.title}')" class="px-2 py-1 bg-emerald-600 text-white font-bold text-xs pixel-press">نسخ لواتساب</button>
              <button onclick="deleteQuiz(${idx})" class="p-1 bg-rose-100 text-rose-700 border border-rose-300 text-xs font-bold pixel-press">حذف</button>
            </div>
          </div>
        `;
      });

      app.innerHTML = `
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-black text-slate-900">إدارة المدونات التفاعلية</h2>
            <button onclick="isAdminAuth=false;showHome()" class="text-xs text-rose-600 font-bold">تسجيل الخروج</button>
          </div>
          <div class="space-y-2">
            ${listHtml}
          </div>
          <button onclick="showCreateQuizForm()" class="w-full py-2.5 bg-slate-900 text-white font-black text-xs pixel-bevel pixel-press">
            + إضافة مدونة تفاعلية جديدة برابط مخصص
          </button>
        </div>
      `;
    }

    function checkAdminPass() {
      const p = document.getElementById('adminPass').value;
      if (p === ADMIN_PASS) {
        isAdminAuth = true;
        showAdmin();
      } else {
        alert("رمز المرور غير صحيح!");
      }
    }

    function deleteQuiz(idx) {
      if (confirm("هل أنت متأكد من حذف هذه المدونة التفاعلية؟")) {
        currentQuizzes.splice(idx, 1);
        saveStorageQuizzes(currentQuizzes);
        showAdmin();
      }
    }

    function copyQuizLink(id, title) {
      const url = `${window.location.origin}${window.location.pathname}?quiz=${id}`;
      const msg = `🎯 مدونة فلسفية تفاعلية جديدة من مدونات فخري: *${title}*\n⚡ افتحها الآن على واتساب:\n${url}`;
      navigator.clipboard.writeText(msg).then(() => {
        alert("تم نسخ الرابط مع رسالة جاهزة لقناة واتساب!");
      }).catch(() => {
        prompt("انسخ الرابط التالي:", msg);
      });
    }

    // Initialize View based on URL params or show Home
    const urlParams = new URLSearchParams(window.location.search);
    const quizParam = urlParams.get('quiz');
    if (quizParam) {
      startQuiz(quizParam);
    } else {
      showHome();
    }
  </script>
</body>
</html>
